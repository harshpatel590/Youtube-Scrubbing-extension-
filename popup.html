<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </div>
      <div class="title-block">
        <h1>MX Scrubber</h1>
        <p class="subtitle">Horizontal video scrubbing</p>
      </div>
    </div>
    <span class="version">v1.2</span>
  </header>

  <main>
    <div class="mode-switch" data-active="mouse" role="tablist">
      <div class="mode-slider"></div>
      <button class="mode-btn" data-mode="trackpad" role="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="6" width="18" height="13" rx="2.5"/>
          <path d="M8 15h8"/>
        </svg>
        <span>Trackpad</span>
      </button>
      <button class="mode-btn" data-mode="mouse" role="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="3" width="12" height="18" rx="6"/>
          <path d="M12 7v4"/>
        </svg>
        <span>Mouse wheel</span>
      </button>
    </div>

    <div id="sections"></div>
  </main>

  <footer>
    <div class="reload-row">
      <button id="reload-tab" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-3-6.7M21 3v6h-6"/>
        </svg>
        Reload tab
      </button>
      <button id="reload-ext" class="btn btn-ghost">Reload ext</button>
    </div>
    <button id="reset" class="btn btn-ghost btn-full">Reset all modes</button>
    <p class="hint">Each mode remembers its own values. Changes apply live.</p>
  </footer>

  <div id="toast" class="toast">Saved</div>
  <script src="popup.js"></script>
</body>
</html>
